<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bomb Man - Mini Bomber Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Bomb Man</h1>
    <p>Arrow keys / WASD to move, <strong>Space</strong> to place bomb.</p>

      <span id="status">Destroy all crates!</span>
      <span id="crates"></span>
    </div>
    <canvas id="game" width="416" height="352"></canvas>
  </main>
  <script src="game.js"></script>
</body>
</html>
